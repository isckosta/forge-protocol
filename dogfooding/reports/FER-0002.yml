  expected: The Forge Contract and active Flow should remain authoritative when multiple
    software-development frameworks are available in the same project.
  observed: A Superpowers brainstorming gate interrupted a Forge-governed task and
    required an additional chat approval before implementation, displacing the active
    Forge workflow temporarily.
  evidence:
  - The user requested implementation, but the session stopped after an externally
    imposed design-approval prompt.
  - No repository files were changed during the interruption.
  impact: The task was delayed, and the user had to correct framework precedence before
    work could continue. This indicates a coordination risk when multiple SDD frameworks
    coexist in the project.
  workaround: The user explicitly restored Forge precedence and requested bypassing the
    extra approval flow.
  follow_up: Define and document precedence boundaries so auxiliary SDD frameworks may
    support work without replacing Forge Contract, Flow, or Gate semantics.
