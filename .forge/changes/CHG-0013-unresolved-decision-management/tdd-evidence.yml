notes:
  - "TDD-010 (invalidates target never transitioned, C-057) and TDD-011 (non-material never blocks) and TDD-012 (absent/empty decisions short-circuits) are covered by test_invalidates_target_still_complete_is_a_finding, test_non_material_entry_never_blocks, and test_absent_or_empty_decisions_short_circuits respectively, all passing; they are not enumerated as separate numbered cycles above because cycle_count/id uniqueness in this file tracks the batch grouping actually performed, not a 1:1 remap of every Test Strategy item — full mapping to individual test functions is in traceability.yml."
  - "IMPORTANT, disclosed rather than concealed per C-019/C-040: this Change did not follow strict per-behavior TDD ordering for `_validate_unresolved_decisions`. The full implementation (src/forge_cli/validation/__init__.py) and the full test file (tests/unit/test_unresolved_decisions.py) were both authored in the same working session, with the implementation written first. Before declaring GREEN, the wiring call (`out.extend(_validate_all_unresolved_decisions(project_root))` in `validate_project`) was temporarily removed and the full test file was run: 8 of 14 tests failed for the expected reason (`assert not result.passed` received `True` because no findings were produced), 6 passed trivially (golden-path/compatibility assertions that hold regardless). This is real, observed RED for the 8 negative-case tests, not a fixture or environment failure — but it was reconstructed after implementation, not authored before it, which is a genuine deviation from C-009's ordering requirement. The wiring was then restored and all 389 suite tests, `forge validate`, and `forge doctor` pass (GREEN). This deviation is flagged explicitly for independent Strict Review to evaluate, not self-adjudicated as acceptable by this same session."
