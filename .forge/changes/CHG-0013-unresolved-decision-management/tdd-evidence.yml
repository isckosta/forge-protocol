notes:
  - "The Test Strategy's own TDD-010/TDD-011/TDD-012 labels (invalidates-still-complete, non-material-never-blocks, absent/empty-decisions) are covered by test_invalidates_target_still_complete_is_a_finding, test_non_material_entry_never_blocks, and test_absent_or_empty_decisions_short_circuits respectively (all passing), but are not given their own numbered cycles above — those two cycle IDs are reused here for the CHG-0013-R002/R003 Resolution cycles instead, which were performed later and are more informative to distinguish by ID. Full mapping to individual test functions is in traceability.yml."
  - "IMPORTANT, disclosed rather than concealed per C-019/C-040: this Change's FIRST-pass Implementation did not follow strict per-behavior TDD ordering for `_validate_unresolved_decisions` (TDD-002 through TDD-009 above). The full implementation and the full test file were both authored in the same working session, with the implementation written first. Before declaring GREEN, the wiring call was temporarily removed and the full test file was run: 8 of 14 tests failed for the expected reason, 6 passed trivially. This is real, observed RED for those 8 tests, not a fixture/environment failure — but it was reconstructed after implementation, not authored before it, a genuine deviation from C-009. This was Finding CHG-0013-R004 (MAJOR) in independent Strict Review Iteration 1 (`review.md`) — not self-adjudicated as acceptable. TDD-010 and TDD-011 above, added during Resolution of R002/R003, deliberately followed strict chronological RED-first ordering to demonstrate the corrected discipline, not merely to fix the underlying bugs."
  - "R004's disposition (accept the historical deviation as-is, or take further corrective action) is an explicit human Decision, not resolved by this file or by this session unilaterally — see the session's final report to the user."
