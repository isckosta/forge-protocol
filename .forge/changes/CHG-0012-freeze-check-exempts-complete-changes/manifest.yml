      kind: initial_review
      status: failed
      evidence_gap: >-
        CHG-0012-R001 (BLOCKER): state.current: complete is a self-declared
        field with no programmatic Completion Gate anywhere in this
        codebase (no C-027/C-035 validator, no forge complete command), and
        this fix's exemption turns it into a total, unscoped bypass of
        C-026's freeze-drift protection for the Change's own reviewed
        subject files, not just for unrelated repository activity —
        reproduced directly against validate_project: a complete Change's
        own reviewed file, silently edited after its Review passed,
        produces zero findings, where the identical edit against a
        non-complete Change is correctly caught. No other check in
        _validate_protocol2_review_provenance compensates. See review.md
        for full findings and a proposed scoped-diff alternative.
documentation:
  impact_evaluated: true
  update_required: true
  reason: >-
    Internal Core validation behavior correction affecting CI-visible
    `forge validate` output for every completed Protocol 2 Change; recorded
    in CHANGELOG.md under a new "Freeze check exempts complete Changes"
    entry. No user-facing CLI surface, schema, or Contract text changed.
