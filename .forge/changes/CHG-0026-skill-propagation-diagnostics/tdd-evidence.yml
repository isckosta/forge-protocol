schema: forge/tdd-evidence@1
change: CHG-0026
status: compliant
cycle_count: 2
cycles:
  - id: TDD-001
    title: Install and projected skills disclose session-scoped discovery delay
    requirements: [FR-001, FR-002, AC-001, AC-002]
    red:
      observed: true
      failure_reason: >-
        Three focused expectations failed against the unmodified implementation:
        the install output had no catalog-delay fallback, and neither packaged
        workflow template disclosed the Harness runtime limitation. The run was
        pytest -q on the three focused test cases and produced 3 failed.
    green:
      observed: true
      evidence: >-
        The same three focused tests passed 3/3 after the CLI diagnostic and
        both workflow-template disclosures were added. The Adapter command and
        projection matrix passed 41 tests; the full suite passed 579 tests with
        two environment-only wheel-build failures.
    notes:
      - >-
        Codex's live catalog timing was not directly reproducible in this
        repository session; the implementation deliberately uses a generic,
        non-guaranteeing Harness-runtime disclosure.
  - id: TDD-002
    title: Claude Code fallback names the nested published SKILL.md path
    requirements: [FR-001, AC-001]
    red:
      observed: true
      failure_reason: >-
        The Claude Code install regression failed against the first
        implementation because it printed `.claude/SKILL.md` while the
        published resource is `.claude/skills/forge/SKILL.md`.
    green:
      observed: true
      evidence: >-
        After deriving the fallback from the planned SKILL.md operation, the
        Codex and Claude Code install-path regressions passed 2/2; the complete
        Adapter command/projection matrix passed 42 tests.
