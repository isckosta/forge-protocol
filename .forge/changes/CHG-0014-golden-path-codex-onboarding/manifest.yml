      evidence_gap: >-
        CHG-0014-R001 (BLOCKER, domain_invariants/C-026): the effective
        reviewable workspace is not clean -- four Git-visible, non-ignored,
        untracked files (.codex/config.toml,
        docs/document-2026-08-13T04-46-37-625Z.md,
        docs/superpowers/specs/2026-08-13-chg-0006-completion-remediation-design.md,
        uv.lock) exist that are no part of the frozen implementation-001
        subject and no part of this Change's review-control-metadata
        exception. Reproduced directly against
        src/forge_cli/validation/__init__.py::_changed/
        _reviewable_workspace_delta: _changed(...) returns True with exactly
        those four paths as the delta, which would make any bound
        pending/passed Review Iteration referencing implementation-001 fail
        forge validate with a C-026 finding. This blocks review_passed for
        this Change today regardless of Implementation quality; it is a
        workspace-hygiene precondition, not a defect in the reviewed diff.
        CHG-0014-R002 (MAJOR, correctness/test_quality/documentation):
        forge doctor's new _adapter_readiness_checks aggregation
        (src/forge_cli/doctor/__init__.py) maps AdapterCheck status
        "warning" to "passed", so a genuine warning (e.g. compatibility
        cannot be checked until project configuration is valid) renders as
        a self-contradictory "PASS ... cannot be checked" line -- reproduced
        directly end to end against a throwaway repository. Untested: no
        shipped test exercises a warning-status aggregated adapter check.
        CHG-0014-R003 (MINOR, test_quality): Layer B's git merge-base
        --is-ancestor ordering assertions in
        tests/golden_path/test_golden_path_standard.py are self-referential
        given the linear, single-script commit sequence that produces them;
        the genuinely non-vacuous RED/GREEN content assertions are
        independently confirmed sound. See review.md Iteration 1 for full
        findings, evidence, and positive observations.
