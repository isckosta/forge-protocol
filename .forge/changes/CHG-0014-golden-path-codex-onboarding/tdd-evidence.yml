schema: forge/tdd-evidence@1
change: CHG-0014
status: compliant
cycle_count: 5
cycles:
  - id: TDD-001A
    title: Codex gate instructions include the full completion-gate set
    requirements: [FR-003]
    red:
      observed: true
      failure_reason: >-
        test_projection_renders_documentation_and_tdd_completion_gate_instructions
        and test_projection_renders_pre_implementation_boundary_instruction
        (added to tests/unit/test_codex_projection_gates.py before touching
        projection.py) both failed on AssertionError because
        _gate_instructions had no branch for documentation_impact_evaluated,
        required_documentation_updated, or tdd_compliant_or_explicitly_excepted;
        the two paired negative tests
        (test_projection_does_not_invent_documentation_or_tdd_exception_gates,
        test_projection_does_not_invent_pre_implementation_boundary_for_flow_without_one)
        passed trivially at the same time, as expected for a not-yet-existing
        behavior. Full pytest transcript observed directly (11 tests, 2
        failed for exactly this reason, 9 passed), not reconstructed.
    green:
      observed: true
      evidence: >-
        All 11 tests in tests/unit/test_codex_projection_gates.py pass after
        adding the three completion-gate branches to _gate_instructions.
  - id: TDD-001B
    title: Codex gate instructions state the pre-Implementation boundary
    requirements: [FR-003]
    red:
      observed: true
      failure_reason: >-
        Same RED execution as TDD-001A (both new positive assertions were
        authored and run together before any projection.py change);
        test_projection_renders_pre_implementation_boundary_instruction
        failed because _gate_instructions never read
        gates.before_implementation at all.
      notes: ["Recorded as its own cycle because it is a distinct requirement (FR-003's pre-Implementation half) even though the RED execution was observed in the same pytest run as TDD-001A."]
    green:
      observed: true
      evidence: >-
        test_projection_renders_pre_implementation_boundary_instruction and
        test_projection_does_not_invent_pre_implementation_boundary_for_flow_without_one
        both pass after adding the before_implementation branch.
  - id: TDD-002
    title: forge adapter install prints a success/next-step confirmation
    requirements: [FR-002]
    red:
      observed: true
      failure_reason: >-
        test_adapter_install_confirms_success_and_names_the_next_step (added
        to tests/cli/test_adapter_commands.py before touching adapter_cli.py)
        failed on AssertionError: the expected confirmation substring was
        absent from stdout, which contained only the plan operation lines and
        two capability-limitation WARN lines. The two paired negative tests
        (dry-run prints no confirmation, reinstall prints no confirmation)
        passed trivially at the same time, as expected.
    green:
      observed: true
      evidence: >-
        All 21 tests in tests/cli/test_adapter_commands.py pass after adding
        the confirmation branch to adapter_cli.py's install() command.
  - id: TDD-003
    title: forge doctor aggregates installed-Adapter diagnostics
    requirements: [FR-001]
    red:
      observed: true
      failure_reason: >-
        test_doctor_reports_installed_adapter_readiness and
        test_doctor_reports_drifted_adapter_as_failed (added to
        tests/unit/test_doctor_diagnostics.py before touching
        doctor/__init__.py) failed: the first on `assert adapter_checks`
        (empty dict — no adapter: prefixed checks existed at all), the
        second on `assert result.passed is False` (True, because nothing
        aggregated the drifted Adapter's failing check). The paired negative
        test (no installed Adapter -> no adapter: checks) and the pre-existing
        exact-check-id-list test both passed unchanged at the same time.
      notes: ["A companion CLI-level assertion (test_doctor_exit_code_reflects_drifted_adapter_installation, tests/cli/test_doctor.py) was added after doctor/__init__.py's fix already existed and passed immediately (no RED at that layer) -- disclosed rather than misrepresented as its own TDD cycle. It exercises the same behavior through the CLI composition layer, which was not itself separately implemented."]
    green:
      observed: true
      evidence: >-
        All 7 tests in tests/unit/test_doctor_diagnostics.py, and the 3 tests
        in tests/cli/test_doctor.py, pass after adding _adapter_readiness_checks
        to doctor/__init__.py::diagnose().
  - id: TDD-004
    title: forge doctor preserves Adapter warning status instead of relabeling it passed
    requirements: [FR-001]
    red:
      observed: true
      failure_reason: >-
        Resolution of independent Strict Review Iteration 1's MAJOR
        (CHG-0014-R002). test_doctor_preserves_adapter_warning_status_instead_of_relabeling_as_passed
        (added to tests/unit/test_doctor_diagnostics.py before touching
        doctor/__init__.py or app.py) failed with `assert 'passed' ==
        'warning'`: _adapter_readiness_checks's status_map collapsed every
        warning-status AdapterCheck to "passed", so a genuinely unchecked
        compatibility check ("Protocol compatibility cannot be checked until
        project configuration is valid.") rendered as PASS. Reproduced by
        corrupting .forge/forge.yml after a real forge adapter install codex,
        exactly as the independent Reviewer's own repro did.
    green:
      observed: true
      evidence: >-
        status_map now maps warning -> warning (not passed);
        app.py's doctor() labels dict gained a "warning": "WARN" entry (it had
        none before, so a warning status reaching the CLI layer would have
        raised KeyError — untested and unreachable before this fix, since
        nothing produced a warning-status DoctorCheck until this Change's own
        TDD-003). test_doctor_preserves_adapter_warning_status_instead_of_relabeling_as_passed
        passes; the full suite (407 tests, up from 406) passes; manually
        reproduced end to end against a throwaway repository, matching the
        Reviewer's exact repro, with WARN (not PASS) now shown for all three
        previously-mislabeled lines. One pre-existing test
        (test_doctor_reports_installed_adapter_readiness) asserted `all(check.status
        == "passed")` for a healthy install, which was itself only true
        because of this bug (a healthy Codex install legitimately carries a
        "warning" status limitations check); updated to assert `status !=
        "failed"` plus explicit checks on both the warning and passed cases,
        rather than loosened to hide the distinction.
notes:
  - >-
    TDD-004 is a Resolution cycle (role: resolution in provenance.yml),
    produced by this session acting as Resolver after independent Strict
    Review Iteration 1 (review-001) found CHG-0014-R002. Reviewer and
    Resolver remain distinct conceptual Roles (C-026) even though the same
    session that performed the original Implementation performed this
    Resolution; the Review itself ran in a separate, independent
    Execution/Context (review-exec-chg0014-20260818-01) that has no memory of
    this session, which is what Protocol 2 §2 actually requires independence
    of.
  - >-
    CHG-0014-R001 (BLOCKER) and CHG-0014-R003 (MINOR) were also addressed in
    this same Resolution but are not TDD cycles: R001 (four unrelated,
    never-committed untracked files leaving the effective reviewable
    workspace dirty) was resolved by removing those files from the working
    tree after explicit user confirmation — a workspace-hygiene action with
    no associated code diff, verifiable via `git status --porcelain -uall`
    rather than a test. R003 (a test docstring/comment overstating what the
    `git merge-base --is-ancestor` ordering assertions in
    tests/golden_path/test_golden_path_standard.py prove) was resolved by
    correcting the docstring/comment text; it is a documentation-accuracy fix
    with no behavioral RED/GREEN of its own.
  - >-
    The Layer B example scenario (username-length validation against
    examples/golden-path-standard/starter/) is a separate, nested Change
    (fixture CHG-0001) constructed live by
    tests/golden_path/test_golden_path_standard.py on every test run,
    including a real subprocess pytest RED before the fix and GREEN after.
    Its own TDD evidence is generated fresh each run (see that test module
    and test-design.md's "Layer B TDD" section); it is not part of this
    Change's own cycle count above because it is not this Change's own
    Implementation, it is what this Change's Implementation causes to be
    reproducible.
  - >-
    All full-suite pytest runs referenced above were executed directly by
    this session against this repository's working tree, not simulated or
    summarized from memory; see verification.md for exact commands and
    counts.
