schema: forge/tdd-evidence@1

change: CHG-0001

cycles:
  - id: TDD-001
    requirement: FR-003
    behavior: forge version reports CLI and supported Protocol versions

    red:
      status: observed
      workflow_run_id: 31667898431
      job_id: 94346320217
      commit: 9b68d9ada980ef14fd62db858dcd31d7cd1fc3d9
      test: tests/cli/test_version.py::test_version_reports_cli_and_supported_protocol_versions
      expected_failure: >
        The public CLI does not yet provide the version command required by FR-003.
      observed_failure: >
        Typer raised RuntimeError: Could not get a command for this Typer instance.
        The package and test dependencies installed successfully, and the test reached
        the CLI invocation before failing because no command was registered.
      valid: true

    green:
      status: observed
      workflow_run_id: 31667967444
      job_id: 94346532519
      commit: 6c1579e62b3c86b8688137e3bea34810f626e400
      result: >
        GitHub Actions completed successfully. The FR-003 CLI behavior test passed
        after preserving Typer command-group semantics and implementing the version
        command.

    refactor:
      status: not_performed
      reason: >
        No additional refactoring was justified after GREEN. The implementation is
        already minimal for the current requirement.

  - id: TDD-002
    requirements: [FR-001, FR-002, FR-006]
    behavior: resolve the Forge Project Root from a Git repository or nested directory

    red:
      status: observed
      workflow_run_id: 31668342390
      job_id: 94347687237
      commit: 5ebd490d08bd75848e783f9692f4ee3652b6cf72
      tests:
        - tests/unit/test_git_project_root.py::test_resolves_git_repository_root_from_root_directory
        - tests/unit/test_git_project_root.py::test_resolves_same_git_repository_root_from_nested_directory
        - tests/unit/test_git_project_root.py::test_rejects_directory_outside_git_repository
      expected_failure: >
        The Git boundary exists only as an empty scaffold and does not yet resolve a
        Project Root or expose an explicit non-repository error.
      observed_failure: >
        All three new tests failed with AttributeError because resolve_project_root
        and NotGitRepositoryError were absent. The existing version test passed,
        confirming the environment and prior behavior remained healthy.
      valid: true

    green:
