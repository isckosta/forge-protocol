schema: forge/tdd-evidence@1

change: CHG-0001

cycles:
  - id: TDD-001
    requirement: FR-003
    behavior: forge version reports CLI and supported Protocol versions
    red:
      status: observed
      workflow_run_id: 31667898431
      job_id: 94346320217
      commit: 9b68d9ada980ef14fd62db858dcd31d7cd1fc3d9
      test: tests/cli/test_version.py::test_version_reports_cli_and_supported_protocol_versions
      expected_failure: The public CLI does not yet provide the version command required by FR-003.
      observed_failure: Typer could not build a command because no command was registered.
      valid: true
    green:
      status: observed
      workflow_run_id: 31667967444
      job_id: 94346532519
      commit: 6c1579e62b3c86b8688137e3bea34810f626e400
      result: The FR-003 CLI behavior test passed.
    refactor:
      status: not_performed
      reason: The implementation was already minimal.

  - id: TDD-002
    requirements: [FR-001, FR-002, FR-006]
    behavior: resolve the Forge Project Root from a Git repository or nested directory
    red:
      status: observed
      workflow_run_id: 31668342390
      job_id: 94347687237
      commit: 5ebd490d08bd75848e783f9692f4ee3652b6cf72
      tests:
        - tests/unit/test_git_project_root.py::test_resolves_git_repository_root_from_root_directory
        - tests/unit/test_git_project_root.py::test_resolves_same_git_repository_root_from_nested_directory
        - tests/unit/test_git_project_root.py::test_rejects_directory_outside_git_repository
      expected_failure: The Git boundary does not yet resolve a Project Root or expose an explicit non-repository error.
      observed_failure: All three new tests failed because resolve_project_root and NotGitRepositoryError were absent while prior tests passed.
      valid: true
    green:
      status: observed
      workflow_run_id: 31668399469
      job_id: 94347862179
      commit: 0ebcafc09dc9abe96ac759a6424e8a84dc83f11a
      result: GitHub Actions passed for root, nested-path, and non-repository behavior.
    refactor:
      status: not_performed
      reason: The Git boundary remained minimal.

  - id: TDD-003
    requirements: [FR-004, FR-005, FR-007, FR-008]
    behavior: publish a Forge workspace safely without overwrite or partial state
    red:
      status: observed
      workflow_run_id: 31668564019
      job_id: 94348345860
      commit: b55054c652579f6c83eda8ab3feb97b6766bb4d9
      tests:
        - tests/unit/test_workspace_initialization.py::test_initializes_forge_workspace_with_requested_files
        - tests/unit/test_workspace_initialization.py::test_rejects_existing_forge_workspace_without_modifying_it
        - tests/unit/test_workspace_initialization.py::test_failed_initialization_does_not_publish_partial_workspace
      expected_failure: The workspace boundary is only an empty scaffold and cannot initialize, reject overwrite, or guarantee rollback-safe publication.
      observed_failure: All three new tests failed with AttributeError because initialize_workspace and the explicit workspace errors were absent; four prior tests passed.
      valid: true
    green:
      status: observed
      workflow_run_id: 31668623054
      job_id: 94348523529
      commit: 47d5b04c9245f1978beef06d240773824dedd307
      result: GitHub Actions passed. Workspace publication creates requested files, preserves an existing workspace, validates conflicting plans, and leaves no .forge or staging directory after a failed plan.
    refactor:
      status: not_performed
      reason: The staging publisher, validation, and cleanup logic are already narrowly scoped to the requirements.

  - id: TDD-004
    requirements: [FR-009, FR-010, FR-018, FR-019, FR-023]
    behavior: load and validate Forge project configuration against the canonical Project Schema and supported Protocol versions
    red:
      status: observed
      workflow_run_id: 31669001236
      job_id: 94349625107
      commit: ae29145796d51cff275c98592d2c41f4cb97cc68
      tests:
        - tests/unit/test_project_configuration.py::test_loads_valid_project_configuration
        - tests/unit/test_project_configuration.py::test_rejects_configuration_that_violates_project_schema
        - tests/unit/test_project_configuration.py::test_rejects_unsupported_protocol_version
        - tests/unit/test_project_configuration.py::test_validation_is_deterministic_for_identical_repository_state
      expected_failure: The configuration boundary is only an empty scaffold and cannot parse, validate, or enforce Protocol compatibility.
      observed_failure: All four new tests failed with AttributeError because load_project_configuration and explicit configuration errors were absent; seven prior tests passed.
      valid: true
    green:
      status: observed
      workflow_run_id: 31669052322
      job_id: 94349769493
      commit: 9ac4aa62d7d1407672955700d32fa41c20f16a59
      result: GitHub Actions passed. Forge parses YAML, validates against protocol/schemas/project.schema.json, rejects unsupported Protocol versions, and returns deterministic results for identical state.
    refactor:
      status: not_performed
      reason: The implementation is minimal for the current source-tree execution model. Packaging the canonical Schema as a distribution resource is deferred to installation Verification rather than hidden inside this cycle.

  - id: TDD-005
    requirements: [FR-011, FR-012, FR-013, FR-014, FR-015]
    behavior: resolve canonical Flow and Engineering Contract layers without allowing project configuration to replace canonical semantics
    red:
      status: observed
      workflow_run_id: 31669289131
      job_id: 94350422734
      commit: 438fcd566f54d7958a7e64a2dfba4e0247ee02b9
      tests:
        - tests/unit/test_protocol_resolution.py::test_resolves_effective_standard_flow_from_canonical_and_project_layers
        - tests/unit/test_protocol_resolution.py::test_rejects_unknown_canonical_flow_reference
        - tests/unit/test_protocol_resolution.py::test_project_flow_cannot_redefine_canonical_stages
        - tests/unit/test_protocol_resolution.py::test_effective_contract_is_canonical_contract_plus_project_extension
        - tests/unit/test_protocol_resolution.py::test_project_contract_is_optional_but_canonical_contract_is_required
        - tests/unit/test_protocol_resolution.py::test_fails_when_canonical_contract_is_unavailable
      expected_failure: The Protocol resolution boundary is only an empty scaffold and cannot resolve canonical Flow references or compose the Effective Engineering Contract.
      observed_failure: All six new tests failed with AttributeError because resolution functions and explicit errors were absent; eleven prior tests passed.
      valid: true
    green:
      status: observed
      workflow_run_id: 31669341596
      job_id: 94350569118
      commit: 4dc74fd5d022ca40da998cf6681d6f015c6ca094
      result: GitHub Actions passed. Forge resolves canonical and project Flow layers separately, rejects unknown canonical references and canonical stage redefinition, and composes the canonical Contract before the optional project extension.
    refactor:
      status: not_performed
      reason: The layer-preserving resolver is intentionally small and avoids premature semantic merging of Markdown Contracts.

  - id: TDD-006
    requirements: [FR-016, FR-017, FR-020, FR-021, FR-022, FR-029, FR-030]
    behavior: validate a Forge project through structured findings and expose the result through forge validate
    red:
      status: observed
      workflow_run_id: 31669614311
      job_id: 94351355295
      commit: 673734d35e9f50c33b0ff6553c2aea6a1e8aa287
      tests:
        - tests/unit/test_validation.py::test_valid_project_returns_passed_result
        - tests/unit/test_validation.py::test_missing_workspace_returns_actionable_not_initialized_finding
        - tests/unit/test_validation.py::test_unknown_project_flow_returns_actionable_finding
        - tests/unit/test_validation.py::test_missing_canonical_contract_returns_actionable_finding
        - tests/cli/test_validate.py::test_validate_reports_success_for_valid_forge_project
        - tests/cli/test_validate.py::test_validate_reports_not_initialized_with_exit_code_two
      expected_failure: Forge has no validation application boundary or public validate command.
      observed_failure: Six new tests failed while seventeen prior tests passed. Validation functions were absent and the CLI had no validate command.
      valid: true
    green:
      status: observed
      workflow_run_id: 31669667157
      job_id: 94351504760
      commit: c3f3b9e60106bac112099d848b78b11b32a82d1a
      result: GitHub Actions passed. Forge validates workspace presence, project configuration, project Flow references, canonical Contract availability, renders structured actionable findings, and returns exit code 0 for valid state or 2 for invalid Forge state.
    refactor:
      status: not_performed
      reason: The validation pipeline is intentionally explicit and composes existing boundaries without adding another abstraction layer.
