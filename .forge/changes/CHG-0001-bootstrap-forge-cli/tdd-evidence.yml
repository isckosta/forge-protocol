  - id: TDD-002
    requirements: [FR-001, FR-002, FR-006]
    behavior: resolve the Forge Project Root from a Git repository or nested directory
    red:
      status: observed
      workflow_run_id: 31668342390
      job_id: 94347687237
      commit: 5ebd490d08bd75848e783f9692f4ee3652b6cf72
      tests:
        - tests/unit/test_git_project_root.py::test_resolves_git_repository_root_from_root_directory
        - tests/unit/test_git_project_root.py::test_resolves_same_git_repository_root_from_nested_directory
        - tests/unit/test_git_project_root.py::test_rejects_directory_outside_git_repository
      expected_failure: The Git boundary does not yet resolve a Project Root or expose an explicit non-repository error.
      observed_failure: All three new tests failed because resolve_project_root and NotGitRepositoryError were absent while prior tests passed.
      valid: true
    green:
      status: observed
      workflow_run_id: 31668399469
      job_id: 94347862179
      commit: 0ebcafc09dc9abe96ac759a6424e8a84dc83f11a
      result: GitHub Actions passed for root, nested-path, and non-repository behavior.
    refactor:
      status: not_performed
      reason: The Git boundary remained minimal.

  - id: TDD-003
    requirements: [FR-004, FR-005, FR-007, FR-008]
    behavior: publish a Forge workspace safely without overwrite or partial state
    red:
      status: observed
      workflow_run_id: 31668564019
      job_id: 94348345860
      commit: b55054c652579f6c83eda8ab3feb97b6766bb4d9
      tests:
        - tests/unit/test_workspace_initialization.py::test_initializes_forge_workspace_with_requested_files
        - tests/unit/test_workspace_initialization.py::test_rejects_existing_forge_workspace_without_modifying_it
        - tests/unit/test_workspace_initialization.py::test_failed_initialization_does_not_publish_partial_workspace
      expected_failure: The workspace boundary is only an empty scaffold and cannot initialize, reject overwrite, or guarantee rollback-safe publication.
      observed_failure: All three new tests failed with AttributeError because initialize_workspace and the explicit workspace errors were absent; four prior tests passed.
      valid: true
    green:
      status: observed
      workflow_run_id: 31668623054
      job_id: 94348523529
      commit: 47d5b04c9245f1978beef06d240773824dedd307
      result: GitHub Actions passed. Workspace publication creates requested files, preserves an existing workspace, validates conflicting plans, and leaves no .forge or staging directory after a failed plan.
    refactor:
      status: not_performed
      reason: The staging publisher, validation, and cleanup logic are already narrowly scoped to the requirements.

  - id: TDD-004
    requirements: [FR-009, FR-010, FR-018, FR-019, FR-023]
    behavior: load and validate Forge project configuration against the canonical Project Schema and supported Protocol versions
    red:
      status: observed
      workflow_run_id: 31669001236
      job_id: 94349625107
      commit: ae29145796d51cff275c98592d2c41f4cb97cc68
      tests:
        - tests/unit/test_project_configuration.py::test_loads_valid_project_configuration
        - tests/unit/test_project_configuration.py::test_rejects_configuration_that_violates_project_schema
        - tests/unit/test_project_configuration.py::test_rejects_unsupported_protocol_version
        - tests/unit/test_project_configuration.py::test_validation_is_deterministic_for_identical_repository_state
      expected_failure: The configuration boundary is only an empty scaffold and cannot parse, validate, or enforce Protocol compatibility.
      observed_failure: All four new tests failed with AttributeError because load_project_configuration and explicit configuration errors were absent; seven prior tests passed.
      valid: true
    green:
      status: observed
      workflow_run_id: 31669052322
      job_id: 94349769493
      commit: 9ac4aa62d7d1407672955700d32fa41c20f16a59
      result: GitHub Actions passed. Forge parses YAML, validates against protocol/schemas/project.schema.json, rejects unsupported Protocol versions, and returns deterministic results for identical state.
    refactor:
      status: not_performed
      reason: The implementation is minimal for the current source-tree execution model. Packaging the canonical Schema as a distribution resource is deferred to installation Verification rather than hidden inside this cycle.
