      status: failed
      full_review_required: false
      new_material_findings: 1
      finding_classes:
        - resolution_regression
      evidence_gap: >-
        CHG-0046-R005 (BLOCKER): resolution-002's renewal-tolerance
        mechanism for MR-015 (the corrected design replacing DEC-001's
        rejected state.current boundary) checks only that a renewal
        record's commit is an ancestor of head_revision, never that it is
        a descendant of (or equal to) the current subject_commit. A
        renewal record anchored during an earlier freeze cycle therefore
        remains valid forever and silently tolerates an unrelated,
        unexplained divergence of the same paths from a later frozen
        subject -- independently reproduced end-to-end against a
        disposable fixture repository (MERGE READY reported for a
        post-freeze tamper no renewal record actually covers). Also a
        direct, undisclosed textual conflict this Resolution itself
        introduces: Specification's FR-001/AC-001 require the renewal
        record's commit to equal head_revision exactly; Architecture and
        the actual code both implement the strictly broader "ancestor of"
        relation instead, and neither artifact reconciles the
        disagreement. The Resolution Delta itself matches its declared
        scope exactly (no Out-of-Scope Mutation); R005 is a correctness
        defect within that Delta, not an Out-of-Scope Mutation.
