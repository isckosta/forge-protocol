- id: TDD-010
  title: forge change review-status reports mode/profile/phase/findings/next-step; freshly-scaffolded and nonexistent Changes handled explicitly; stopped is a non-authoritative observability state
  requirements:
  - FR-006
  - FR-007
  behavior: New read-only CLI command resolves and prints a Change's mode, effective profile, phase (or "Review not yet started"), Finding counts, and a next-step hint derived directly from manifest state (DEC-002 -- no merge_readiness call). A stopped phase is reported as incomplete, never as converged, and forge validate accepts it alongside a non-passed status.
  red:
    command: .venv/bin/python -m pytest tests/cli/test_change_review_status.py -q
    result: 3 failed (No such command 'review-status'), 2 passed (trivially -- nonexistent-Change and forge-validate-accepts-stopped cases needed no new code)
    reason: The command did not exist yet.
  green:
    command: .venv/bin/python -m pytest tests/cli/test_change_review_status.py -q
    result: 5 passed
  notes:
  - The two RED-trivial cases (AC-017's nonexistent-Change error, AC-018's forge validate acceptance) were already correct by construction of prior cycles (Typer's own command-not-found handling; TDD-004's narrowly-scoped consistency check) -- recorded here per C-016, not claimed as new behavior this cycle introduced.
