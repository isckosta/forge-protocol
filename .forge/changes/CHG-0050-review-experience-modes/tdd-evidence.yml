schema: forge/tdd-evidence@1
change: CHG-0050
status: compliant
cycle_count: 11
cycles:
- id: TDD-011
  title: "Resolution (Strict Review Iteration 1, R001, MAJOR): review-status must not crash with an unhandled KeyError on an invalid project-flow-override profile"
  requirements:
  - FR-006
  behavior: An independent Strict Reviewer reproduced a live crash -- an invalid `.forge/flows/<flow>.yml` review.profile override (e.g. "super-strict") reached PROFILE_RANK[floor] unguarded inside resolve_effective_review_profile via review_status()'s call chain, raising an unhandled KeyError instead of degrading the way the adjacent try/except already does for other configuration errors. Per C-018, the defect is proven with a regression test before the fix.
  red:
    command: .venv/bin/python -m pytest tests/cli/test_change_review_status.py -q -k invalid_project_flow_override
    result: "1 failed: Result KeyError('super-strict'), exit_code 1"
    reason: review_status()'s try/except around profile resolution did not catch KeyError.
  green:
    command: .venv/bin/python -m pytest tests/cli/test_change_review_status.py -q
    result: 6 passed
  notes:
  - Also resolved R002 (MINOR, non-blocking) in the same Resolution scope -- extracted the duplicated canonical-profile derivation shared by compute_review_profile_floor and _validate_review_profile_floor into one _canonical_review_profile helper; behavior-preserving (TDD-001's tests pass unchanged). Also corrected R004 (OBSERVATION) -- test-strategy.md's TDD-010 prose overstated "byte-identical" when the scaffold always writes review.mode explicitly.
- id: TDD-001
  title: compute_review_profile_floor extraction is behavior-preserving
  requirements:
  - FR-002
  behavior: Extracts the floor-computation logic already inline inside _validate_review_profile_floor into a standalone, reusable function returning the canonical or project-override profile.
  red:
    command: .venv/bin/python -m pytest tests/unit/test_validation_review_profile.py -q
    result: 2 failed, 3 passed
    reason: "AttributeError: module 'forge_cli.validation' has no attribute 'compute_review_profile_floor' -- the function did not exist yet."
  green:
    command: .venv/bin/python -m pytest tests/unit/test_validation_review_profile.py -q
    result: 5 passed
  notes:
  - _validate_review_profile_floor was refactored to call the new function instead of duplicating its logic; existing floor-validator tests re-ran unchanged.
- id: TDD-002
  title: resolve_effective_review_profile never ranks below the floor; thorough steps up one rank capped at strict
  requirements:
  - FR-002
  behavior: recommended/fast always resolve to exactly the Flow-derived floor; thorough resolves one PROFILE_RANK step above the floor, capped at strict.
  red:
    command: .venv/bin/python -m pytest tests/unit/test_protocol_resolution_review_mode.py -q
    result: "ImportError: cannot import name 'resolve_effective_review_profile' from 'forge_cli.protocol_resolution'"
    reason: The function did not exist yet.
  green:
    command: .venv/bin/python -m pytest tests/unit/test_protocol_resolution_review_mode.py tests/unit/test_validation_review_profile.py -q
    result: 14 passed
  notes:
  - PROFILE_RANK was moved from validation/__init__.py to protocol_resolution/__init__.py (validation already imports from protocol_resolution, so the reverse import would be circular); validation keeps a local alias for its existing call sites.
- id: TDD-003
  title: change-v2.schema.json accepts review.mode/review.current_phase and rejects invalid values
  requirements:
  - FR-001
  - FR-004
  behavior: The review object gains two optional enum properties; omission still validates; an out-of-enum value is rejected.
  red:
    command: .venv/bin/python -m pytest tests/contract/test_review_profile_schemas.py -q -k "mode or current_phase"
    result: 9 failed, 4 passed
    reason: "Additional properties are not allowed ('mode'/'current_phase' was unexpected) -- confirmed by temporarily stashing the schema edit and re-running."
  green:
    command: .venv/bin/python -m pytest tests/contract/test_review_profile_schemas.py -q
    result: 31 passed
  notes: []
