  - id: TDD-010
    title: Prevent mutable provenance from moving a frozen review subject
    requirements: [FR-008, FR-012, FR-014, FR-017, FR-018, FR-019, INV-002, INV-005, CHG-0008-R007]
    behavior: >-
      Core anchors referenced subject provenance and historical Review Iteration subject bindings
      to their first committed Git representation before using the current immutable reference as
      a workspace baseline. Legitimate append-only review metadata remains possible; rewritten,
      replaced, removed/recreated or shadowed subject authority and incomplete Git history fail closed.
    red:
      valid: true
      commit: 73f865ff712647c24a0203c530703d69c2513ae8
      workflow_run_id: 31906413392
      job_id: 95064855880
      command: pytest -q
      result: '1 failed, 212 passed in 5.49s'
      reason: >-
        The causal CLI regression froze A, committed subject provenance for A, committed a reviewable
        mutation B, then rewrote only allowlisted provenance so both subject and Reviewer coherently
        claimed B. The vulnerable validator returned exit code 0 instead of rejecting the moved baseline.
    green:
      commit: 80292e6acc54a59e15bf4c4919b9286cc2ba5dd6
      workflow_run_id: 31906638536
      command: pytest -q
      result: passed
      distribution_workflow_run_id: 31906638462
      distribution_result: passed
  - id: TDD-011
    title: Preserve historical Review Iteration subject authority across verdicts
    requirements: [FR-008, FR-012, FR-014, FR-017, FR-018, FR-019, INV-002, INV-005, CHG-0008-R008]
    behavior: >-
      A valid committed Protocol 2 Review Iteration permanently binds its Iteration ID, logical
      revision and subject provenance independently of pending/passed/failed lifecycle state.
      Revision-only, subject-provenance-only, simultaneous binding rewrites and Iteration ID
      replacement are rejected; legitimate lifecycle/evidence metadata updates and new Iterations
      remain allowed. R005 concrete binding, R006 effective-workspace freeze, R007 provenance
      authority, Protocol 1 compatibility and FAST/STANDARD/FULL behavior remain covered.
    red:
      valid: true
      commit: 1d70b1282b7c0dd2f5015439281fd493954ca87f
      workflow_run_id: 31917557112
      job_id: 95091910991
      command: pytest -q
      result: failed in Run tests after setup/dependency steps passed
      reason: >-
        The primary tests-only RED proved that the pre-fix validator consulted committed Review
        Iteration authority only while current status was pending or passed, allowing a historical
        failed Iteration to redirect revision or subject_provenance. A supplemental tests-only RED
        at commit 410dc2efe32e1b3c96aaf8f9378d052f7566b68b / Tests run 31917909131 then proved
        that replacing the established Iteration ID itself still escaped lookup until committed
        bound Iteration IDs were explicitly preserved.
    green:
      commit: 66c88be244617864f9e8aea54f044e4bc6eaaa91
      workflow_run_id: 31918012008
      job_id: 95093064159
      command: pytest -q
