  - id: TDD-005
    title: Reject contaminated Strict Review Execution and Execution Context
    requirements: [FR-001, FR-003, FR-004, FR-005, FR-008, FR-009, FR-012]
    behavior: Strict Review requires both a Reviewer Execution and Reviewer Execution Context distinct from the Implementation/Resolution execution and context
    red:
      valid: true
      commit: 3d4883d0a0329a629026f22e4c314ffa04b2bfed
      workflow_run_id: 31899409371
      job_id: 95047717053
      command: pytest -q
      result: 3 failed, 166 passed
      reason: >-
        forge/change@2 still rejected the provider-independent execution/context fields because
        it expected session_ref fields; forge validate also incorrectly accepted distinct
        execution IDs sharing one context and accepted a shared execution with superficially
        distinct context IDs.
      specification_drift_commit: 4ff1295011b5f41f89ed7e47a903f9b2330f86ec
    green:
      commit: fec5ac22c3ef62c213526ae3675f105a2a1afd45
      workflow_run_id: 31899652483
      job_id: 95048292204
      command: pytest -q
      result: 169 passed in 3.79s
    notes:
      - JSON Schema now owns the closed execution/context evidence shape.
      - CLI semantic validation independently rejects equal execution IDs or equal context IDs with C-026.
      - A Role switch inside one conversational/reasoning context therefore cannot satisfy Strict Review.
notes:
  - TDD-001 and TDD-002 remain as historical evidence from CHG-0008's superseded session-shaped design; they are not represented as the final invariant.
  - TDD-005 is the regression cycle for the accepted Specification Drift discovered by the Laravel stress test.
  - TDD compliance covers implementation behavior only. Strict Review remains a separate mandatory Gate and is intentionally pending for an independent Execution Context.
