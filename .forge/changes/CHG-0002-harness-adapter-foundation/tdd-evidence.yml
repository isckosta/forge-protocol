    green:
      workflow_run_id: 31694172063
      job_id: 94427997280
      commit: 447d676bacf108789f042b6830339748e0d917db
      result: Forge and Adapter-internal requirement sources are distinct, supported Forge requirements produce no limitation, unsupported Forge requirements produce explicit enforced=false limitations, ordering is deterministic, and the full test suite passed.

  - id: TDD-004
    requirements: [FR-013, FR-014, FR-015, FR-016, FR-023, NFR-003]
    behavior: represent deterministic immutable Adapter plans and planned artifact operations before any repository mutation
    red:
      valid: true
      workflow_run_id: 31694260046
      job_id: 94428286406
      commit: 19c7b9ca4b189257fa2702039152e1ee21589002
      reason: The canonical AdapterPlan, AdapterOperation, ownership/intent vocabularies, content digest helper, and stable operation ordering did not exist; 4 behavior tests failed while 51 existing tests passed.
    green:
      workflow_run_id: 31694300140
      job_id: 94428417586
      commit: ddbafcd5a8258ab1181f745776565269bc06641e
      result: Immutable plan and operation models now expose canonical ownership and intent vocabularies, deterministic SHA-256 content digests, immutable limitation/conflict collections, and stable path-first operation ordering; the full test suite passed.

  - id: TDD-005
    requirements: [FR-017, FR-018, FR-019, INV-004]
    behavior: classify artifact collisions without filesystem mutation so user-owned state is preserved, Forge-owned updates require proven expected state, and shared artifacts conflict unless an explicit merge result is supplied
    red:
      valid: true
      workflow_run_id: 31694603349
      job_id: 94429387598
      commit: b55388f8cc0af49b5ada8dc29931263a031df279
      reason: Ownership classification did not exist; 7 behavior tests failed while 55 existing tests passed, covering missing targets, user-owned preservation, Forge-owned expected-state checks, and shared merge/no-merge classification.
    green:
      workflow_run_id: 31694653381
      job_id: 94429550285
      commit: 2d8a8e76283f0664d54faaf2f3281cba46f2b18f
      result: A pure immutable OwnershipDecision classifier now returns create/preserve/update/conflict decisions without filesystem access; user-owned existing targets are never marked safe to apply, Forge-owned updates require an expected digest matching current state, and shared targets require an explicit merge result before update classification; the full test suite passed.

  - id: TDD-006
    requirements: [FR-021, FR-022, INV-002]
    behavior: persist deterministic repository-native Adapter installation metadata without duplicating canonical Change lifecycle state
    red:
      valid: true
      workflow_run_id: 31695057843
      job_id: 94430850013
      commit: bc56ebe154e5c597d60bd83e258bbdb749addf95
      reason: Adapter installation state, canonical installation schema, deterministic roundtrip, digest validation, and lifecycle-field rejection did not exist; 4 new tests failed while 62 existing tests passed.
    green:
      workflow_run_id: 31695144941
      job_id: 94431127854
      commit: 95453384d0f4ea9d4214e3d8352307065bb729e5
      result: The canonical installation record now stores only Adapter identity/version, target Harness, Protocol interval, generated Forge-owned artifact digests, and explicit limitations; records are immutable and deterministically serialized, unknown lifecycle fields and invalid digests are rejected, and the full test suite passed.

notes:
  - TDD-001 validates manifest structure; TDD-002 owns compatibility semantics.
  - TDD-003 does not define semantic mappings such as Strict Review -> hooks; callers provide resolved representation requirements so Core remains Harness-agnostic.
  - TDD-004 defines only the plan data model; planner behavior, collision semantics, and filesystem mutation remain intentionally absent.
  - TDD-005 is classification only. It does not read/write filesystem state, prove the provenance/determinism of a shared merge strategy, or complete generated drift detection; those remain for TDD-007/TDD-009/TDD-010.
  - FR-019 is not counted as fully implemented yet because deterministic merge-strategy provenance is not proven by the classifier alone.
  - TDD-006 validates installation-state semantics in the source tree; isolated wheel packaging of the new schema remains explicitly deferred to T-011 and is not claimed here.
  - No Harness-specific SDK or implementation has been introduced.
