notes:
  - TDD-001 validates manifest structure; TDD-002 owns compatibility semantics.
  - TDD-003 does not define semantic mappings such as Strict Review -> hooks; callers provide resolved representation requirements so Core remains Harness-agnostic.
  - TDD-004 defines only the plan data model; planner behavior, collision semantics, and filesystem mutation remain intentionally absent.
  - TDD-005 is classification only. It does not read/write filesystem state; deterministic shared-merge provenance is completed by TDD-009.
  - TDD-006 validates installation-state semantics in the source tree; isolated wheel packaging of the schemas remains explicitly deferred to T-011 and is not claimed here.
  - TDD-007 consumes observed digests supplied by callers; it does not read filesystem state or publish mutations.
  - The initial TDD-008 run 31695550901 failed through an uncontrolled ImportError and is explicitly rejected as RED evidence. The valid RED is run 31695617477.
  - TDD-008 validates preservation against already-resolved Forge requirements. It does not infer Harness capability semantics and introduces no Harness SDK dependency.
  - TDD-009 is pure planning. It performs no filesystem, network, or Harness SDK access and provides deterministic shared-merge provenance through merge_strategy_id.
  - TDD-010 intentionally refuses delete_generated publication because safe deletion has not yet been driven by a dedicated RED/GREEN behavior cycle.
  - FR-031, FR-032, and FR-033 remain uncounted as implemented until a dedicated CLI-boundary audit proves no lifecycle execution or activation-state surface was introduced.
  - No Harness-specific SDK or implementation has been introduced.
