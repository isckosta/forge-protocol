  - id: TDD-003
    requirements: [FR-006, FR-007, FR-008, FR-009, FR-030]
    behavior: distinguish Forge representation requirements from Adapter-internal requirements and surface unsupported Forge requirements as explicit non-enforcement limitations
    red:
      valid: true
      workflow_run_id: 31694116523
      job_id: 94427821901
      commit: bd2dcdf09164c873097c0b704e41c0ff2c85df20
