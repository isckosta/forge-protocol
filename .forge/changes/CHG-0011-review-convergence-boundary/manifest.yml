        Non-Convergence episode it authorizes, allowing a single stale
        decision to bypass the engineer-decision requirement for later,
        independent episodes. CHG-0011-R002 (MAJOR): specification.md AC-009
        contradicts FR-012/Protocol 2 Specification §13 and the actual
        implementation regarding whether a decision is required to append a
        new initial_review Iteration after Non-Convergence. CHG-0011-R003
        (MAJOR): Resolution Scope containment is trivially defeated by an
        unbounded glob (e.g. scope: ["*"]), untested. See review.md for full
        findings (also CHG-0011-R004 MINOR, CHG-0011-R005 OBSERVATION).
