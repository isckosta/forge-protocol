        CHG-0011-R001-R004 verified genuinely resolved by reading the actual
        code/spec diff and adversarially re-probing both the
        convergence_decision per-Iteration binding and the exact-path scope
        containment against real validate_project (scenarios beyond the two
        shipped regression tests). Resolution Delta (3469d66..e52000f)
        recomputed independently, matches resolution-001's declared scope
