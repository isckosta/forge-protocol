name: Publish to PyPI

# CHG-0019: written to be correct and complete, but inert until a real
# GitHub Release is published -- this repository has never published
# one, and this workflow does not create one. Cutting a real release is
# a separate, later, explicitly-authorized human action (see
# RELEASING.md). PyPI trusted-publisher registration for this project is
# also a manual, out-of-band prerequisite this workflow cannot perform.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  release-provenance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require release commit on main
        id: release-ref
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          release_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          git merge-base --is-ancestor "$release_sha" origin/main
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
      - name: Require merged Pull Request provenance
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ steps.release-ref.outputs.release_sha }}
        with:
          script: |
            const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: process.env.RELEASE_SHA,
              per_page: 100,
            });
            const mergedIntoMain = pulls.some(
              (pull) => pull.base.ref === "main" && pull.merged_at,
            );
            if (!mergedIntoMain) {
              core.setFailed(
                `Release commit ${process.env.RELEASE_SHA} has no merged Pull Request into main.`,
              );
            }

  build:
    needs: release-provenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build wheel and sdist
        run: python -m build
      - name: Smoke-test the built wheel offline
        run: |
          python -m venv /tmp/forge-publish-wheel-venv
          /tmp/forge-publish-wheel-venv/bin/pip install dist/*.whl
          /tmp/forge-publish-wheel-venv/bin/forge version
      - name: Smoke-test the built sdist offline
        run: |
          python -m venv /tmp/forge-publish-sdist-venv
          /tmp/forge-publish-sdist-venv/bin/pip install dist/*.tar.gz
          /tmp/forge-publish-sdist-venv/bin/forge version
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (OIDC trusted publishing, no stored token)
        uses: pypa/gh-action-pypi-publish@release/v1
