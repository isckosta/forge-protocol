name: Distribution Verification

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  distribution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build wheel and sdist
        run: python -m build
      - name: Create isolated environment (sdist)
        run: python -m venv /tmp/forge-sdist-venv
      - name: Install sdist only
        run: /tmp/forge-sdist-venv/bin/pip install dist/*.tar.gz
      - name: Verify installed sdist CLI version without network
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ""
        run: /tmp/forge-sdist-venv/bin/forge version
      - name: Create isolated environment
        run: python -m venv /tmp/forge-wheel-venv
      - name: Install wheel only
        run: /tmp/forge-wheel-venv/bin/pip install dist/*.whl
      - name: Copy isolated Adapter probe
        run: cp tests/integration/adapter_wheel_probe.py /tmp/adapter_wheel_probe.py
      - name: Verify installed CLI version without network
        working-directory: /tmp
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ""
        run: /tmp/forge-wheel-venv/bin/forge version
      - name: Verify installed init validate doctor flow without network
        working-directory: /tmp
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ""
        run: |
          rm -rf forge-smoke
          mkdir forge-smoke
          cd forge-smoke
          git init
          mkdir -p services/api
          cd services/api
          /tmp/forge-wheel-venv/bin/forge init
          /tmp/forge-wheel-venv/bin/forge validate
          /tmp/forge-wheel-venv/bin/forge doctor
      - name: Verify Adapter schemas and loaders from isolated wheel without network
        working-directory: /tmp
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ""
        run: /tmp/forge-wheel-venv/bin/python /tmp/adapter_wheel_probe.py
      - name: Inspect runtime dependencies
        run: >-
          /tmp/forge-wheel-venv/bin/python -c "from importlib.metadata import requires; d='\n'.join(requires('forge-protocol') or []).lower(); forbidden=['openai','anthropic','langchain','sqlalchemy','django']; found=[n for n in forbidden if n in d]; assert not found, found; print('Runtime dependency audit passed')"
