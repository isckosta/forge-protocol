name: Distribution Verification

on:
  push:
    branches:
      - chore/chg-0001-verification
      - feat/chg-0002-harness-adapter-foundation
  pull_request:

jobs:
  distribution:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build wheel
        run: python -m build --wheel

      - name: Create isolated environment
        run: python -m venv /tmp/forge-wheel-venv

      - name: Install wheel only
        run: /tmp/forge-wheel-venv/bin/pip install dist/*.whl

      - name: Verify installed CLI version without network
        working-directory: /tmp
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ""
        run: /tmp/forge-wheel-venv/bin/forge version

      - name: Verify installed init validate doctor flow without network
        working-directory: /tmp
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ""
        run: |
          rm -rf forge-smoke
          mkdir forge-smoke
          cd forge-smoke
          git init
          mkdir -p services/api
          cd services/api
          /tmp/forge-wheel-venv/bin/forge init
          /tmp/forge-wheel-venv/bin/forge validate
          /tmp/forge-wheel-venv/bin/forge doctor

      - name: Verify Adapter schemas and loaders from isolated wheel without network
        working-directory: /tmp
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ""
        run: |
          /tmp/forge-wheel-venv/bin/python - <<'PY'
          from pathlib import Path
          import tempfile

          from forge_cli.adapters.manifest import load_adapter_manifest
          from forge_cli.adapters.state import (
              AdapterInstallationRecord,
              GeneratedArtifact,
              load_installation_record,
              write_installation_record,
          )
          from forge_cli.protocol_resources import resolve_protocol_root

          protocol_root = resolve_protocol_root()
          assert (protocol_root / "schemas" / "adapter.schema.json").is_file()
          assert (protocol_root / "schemas" / "adapter-installation.schema.json").is_file()

          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              manifest_path = root / "adapter.yml"
              manifest_path.write_text(
                  """schema: forge/adapter@1
adapter:
  id: example
  version: 1.0.0
  harness: example
protocol:
  min: 1
  max_exclusive: 2
capabilities:
  persistent_instructions: true
  commands: true
  skills: true
  hooks: false
  agent_roles: false
  generated_files: true
""",
                  encoding="utf-8",
              )
              manifest = load_adapter_manifest(manifest_path)
              assert manifest.adapter_id == "example"

              installation_path = root / "installation.yml"
              record = AdapterInstallationRecord(
                  adapter_id="example",
                  adapter_version="1.0.0",
                  harness="example",
                  protocol_min=1,
                  protocol_max_exclusive=2,
                  generated_artifacts=(
                      GeneratedArtifact(path="generated.md", digest="a" * 64),
                  ),
                  limitations=(),
              )
              write_installation_record(installation_path, record)
              assert load_installation_record(installation_path) == record

          print("Adapter protocol resource verification passed")
          PY

      - name: Inspect runtime dependencies
        run: |
          /tmp/forge-wheel-venv/bin/python - <<'PY'
          from importlib.metadata import requires

          dependencies = requires("forge-protocol") or []
          normalized = "\n".join(dependencies).lower()
          forbidden = ["openai", "anthropic", "langchain", "sqlalchemy", "django"]
          found = [name for name in forbidden if name in normalized]
          if found:
              raise SystemExit(f"Forbidden runtime dependencies found: {found}")
          print("Runtime dependency audit passed")
          PY
