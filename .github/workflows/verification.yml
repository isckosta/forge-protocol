name: Distribution Verification

on:
  push:
    branches:
      - chore/chg-0001-verification
      - feat/chg-0002-harness-adapter-foundation
  pull_request:

jobs:
  distribution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build wheel
        run: python -m build --wheel
      - name: Create isolated environment
        run: python -m venv /tmp/forge-wheel-venv
      - name: Install wheel only
        run: /tmp/forge-wheel-venv/bin/pip install dist/*.whl
      - name: Verify installed CLI version
        working-directory: /tmp
        run: /tmp/forge-wheel-venv/bin/forge version
      - name: Verify installed init validate doctor flow
        working-directory: /tmp
        run: |
          rm -rf forge-smoke
          mkdir forge-smoke
          cd forge-smoke
          git init
          mkdir -p services/api
          cd services/api
          /tmp/forge-wheel-venv/bin/forge init
          /tmp/forge-wheel-venv/bin/forge validate
          /tmp/forge-wheel-venv/bin/forge doctor
      - name: Verify Adapter schemas and loaders from isolated wheel
        working-directory: /tmp
        run: >-
          /tmp/forge-wheel-venv/bin/python -c "from forge_cli.protocol_resources import resolve_protocol_root; r=resolve_protocol_root(); assert (r/'schemas'/'adapter.schema.json').is_file(); assert (r/'schemas'/'adapter-installation.schema.json').is_file(); print('Adapter protocol resource verification passed')"
      - name: Inspect runtime dependencies
        run: >-
          /tmp/forge-wheel-venv/bin/python -c "from importlib.metadata import requires; d='\n'.join(requires('forge-protocol') or []).lower(); forbidden=['openai','anthropic','langchain','sqlalchemy','django']; found=[n for n in forbidden if n in d]; assert not found, found; print('Runtime dependency audit passed')"
