schema: forge/policy/review@2

review:
  required: true
  strict: true
  adversarial: true
  objective: >
    Identify plausible reasons why the implementation should not be accepted,
    rather than attempting merely to confirm that it appears correct.
  severities: [blocker, major, minor, observation]
  blocking: [blocker, major]
  dimensions:
    - requirement_compliance
    - tdd_compliance
    - correctness
    - test_quality
    - edge_cases
    - invalid_states
    - domain_invariants
    - architecture
    - authorization
    - security
    - persistence
    - data_integrity
    - concurrency
    - transactions
    - performance
    - maintainability
    - backward_compatibility
    - documentation
  tdd_review:
    inspect:
      - test_precedes_production_behavior
      - red_was_observed
      - red_failed_for_expected_reason
      - test_validates_behavior
      - green_scope_is_proportional
      - refactor_preserved_behavior
      - post_hoc_tests_not_misrepresented
      - behavioral_requirements_have_evidence
  evidence:
    required_for: [blocker, major]
  reviewer_resolver_separation:
    independence:
      fast: execution_context
      standard: execution_context
      full: execution_context
    same_execution_forbidden: true
    same_context_forbidden: true
    role_switch_is_independence: false
    self_review_satisfies_strict_review: false
    provenance_required_for_review_passed: true
    minimum_assurance: recorded
    revision_binding_required: true
    same_harness_model_or_provider_allowed: true
    human_preferred_for_full: true
  diff_only_review:
    allowed: false
  passing_tests_are_sufficient:
    value: false
  re_review:
    required_after_blocking_resolution: true
    independent_from_resolution_execution: true
    target_resolution_revision: true
