schema: forge/policy/review@2
review:
  required: true
  # profile documents the Protocol's own highest-tier review posture
  # (the `full`/`strict` Flow). The profile that actually applies to a
  # given Change is derived from that Change's effective Flow
  # (protocol/flows/{fast,standard,full}.yml's own `review.profile`),
  # never from this policy alone -- this field is the Protocol floor,
  # not a per-Change value.
  profile: strict
  strict: true
  adversarial: true
  objective: >
    Identify plausible reasons why the implementation should not be accepted,
    rather than merely confirming that it appears correct.
  severities: [blocker, major, minor, observation]
  blocking: [blocker, major]
  dimensions: [requirement_compliance, tdd_compliance, correctness, test_quality, edge_cases, invalid_states, domain_invariants, architecture, authorization, security, persistence, data_integrity, concurrency, transactions, performance, maintainability, backward_compatibility, documentation]
  evidence:
    required_for: [blocker, major]
  reviewer_resolver_separation:
    independence: {fast: execution_context, standard: execution_context, full: execution_context}
    same_execution_forbidden: true
    same_context_forbidden: true
    role_switch_is_independence: false
    self_review_satisfies_strict_review: false
    provenance_required_for_review_passed: true
    minimum_assurance: recorded
    logical_revision_binding_required: true
    immutable_revision_binding_required: true
    review_subject_freeze_required: true
    post_freeze_subject_mutation_invalidates_binding: true
    subject_provenance_append_only_after_first_commit: true
    review_iteration_subject_binding_append_only_after_first_commit: true
    mutable_review_metadata_must_not_redefine_frozen_subject: true
    complete_git_history_required_for_history_anchor: true
    effective_workspace_delta_sources: [committed, staged, unstaged, untracked]
    git_ignored_paths_excluded_from_workspace_delta: true
    review_metadata_commits_may_follow_freeze: true
    review_metadata_paths_are_exact_and_change_local: true
    review_metadata_symlink_substitution_allowed: false
    same_harness_model_or_provider_allowed: true
    human_preferred_for_full: true
  diff_only_review: {allowed: false}
  passing_tests_are_sufficient: {value: false}
  re_review:
    required_after_blocking_resolution: true
    independent_from_resolution_execution: true
    target_resolution_revision: true
    target_concrete_immutable_revision: true
  resolution_verification:
    classification_optional: true
    scope_and_targets_required_on_referenced_resolution: true
    unrestricted_re_audit_forbidden: true
    out_of_scope_mutation_requires_full_review_escalation: true
    out_of_scope_mutation_cannot_pass: true
    convergence_limit: 2
    convergence_counter_source: core_derived_from_iterations
    convergence_counter_self_declaration_authoritative: false
    non_convergence_state: review_convergence_failed
    non_convergence_blocks_passed_status: true
    non_convergence_blocks_further_resolution_verification: true
    non_convergence_requires_decision: true
    decision_options: [new_full_review, return_to_earlier_phase, accept_residual_risk, abort_or_supersede]
    accept_residual_risk_requires_project_policy_permission: true
    unresolved_finding_recurrence_does_not_increment_counter: true
    unrelated_latent_finding_does_not_increment_counter: true
    unrelated_latent_finding_must_be_recorded: true
    forge_selects_decision_automatically: false
