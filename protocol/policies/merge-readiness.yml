schema: forge/policy/merge-readiness@1
merge_readiness:
  material_prefixes:
    - .github/workflows/
    - protocol/
    - src/
    - tests/
    - adapters/
    - .claude/skills/forge/
    - .agents/skills/forge/
  material_paths:
    - pyproject.toml
    - setup.cfg
    - tox.ini
    - .claude/CLAUDE.md
    - .forge/adapters/claude-code/installation.yml
    - .forge/adapters/codex/installation.yml
  permitted_paths:
    - README.md
    - CONTRIBUTING.md
    - CHANGELOG.md
  permitted_prefixes:
    - docs/
    - examples/
  change_prefix: .forge/changes/
