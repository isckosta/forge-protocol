schema: forge/policy/merge-readiness@1
merge_readiness:
  material_prefixes:
    - .github/workflows/
    - protocol/
    - src/
    - tests/
    - adapters/
  material_paths:
    - pyproject.toml
    - setup.cfg
    - tox.ini
  permitted_paths:
    - README.md
    - CONTRIBUTING.md
    - CHANGELOG.md
  permitted_prefixes:
    - docs/
    - examples/
  change_prefix: .forge/changes/
